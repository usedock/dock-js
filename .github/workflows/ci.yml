name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Read pinned scenarios commit
        id: ref
        run: echo "sha=$(tr -d '[:space:]' < SCENARIOS_REF)" >> "$GITHUB_OUTPUT"
      # actions/checkout v7.0.1; usedock/dock is public, so no token is needed
      - name: Check out sdk-scenarios at SCENARIOS_REF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: usedock/dock
          ref: ${{ steps.ref.outputs.sha }}
          path: dock
          sparse-checkout: sdk-scenarios
      - name: Unit tests and shared scenarios (offline)
        run: bun run test
        env:
          DOCK_SCENARIOS_DIR: ${{ github.workspace }}/dock/sdk-scenarios

  install-from-git:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      # dev dependencies (typescript) are needed by `npm pack` to run prepare
      - run: bun install --frozen-lockfile
      - name: Install from a local path
        run: |
          bun run build
          bash scripts/smoke-install.sh "$GITHUB_WORKSPACE"
      - name: Install from a packed tarball
        run: |
          # npm pack runs prepare, so this builds dist from a clean tree
          rm -rf dist
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          bash scripts/smoke-install.sh "$RUNNER_TEMP/$tarball"
      - name: Install the packed tarball with bun (the README's bun path)
        run: |
          set -euo pipefail
          tarball="$(ls "$RUNNER_TEMP"/usedock-sdk-*.tgz)"
          proj="$(mktemp -d)"
          cd "$proj"
          echo '{ "name": "smoke", "version": "0.0.0", "private": true, "type": "module" }' > package.json
          bun add "$tarball"
          bun -e "const m = await import('@usedock/sdk'); if (typeof m.Dock !== 'function') throw new Error('Dock missing'); console.log('bun import ok')"
      - name: Install from a git URL (committed HEAD)
        run: |
          rm -rf dist
          bash scripts/smoke-install.sh "git+file://$GITHUB_WORKSPACE"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
